name: My First Workflow

# Event 
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - closed
    branches:
      - 'main'
      - 'dev-**'
      - 'releases/**'
  push:
    branches:
      - 'main'
      - 'dev-**'
      - 'releases/**'

  workflow_dispatch:

# Workflow
jobs:
    test:
        runs-on: ubuntu-latest
        # step
        steps:
           - name: checkout code
             uses: actions/checkout@v4

           - name: Set up Node.js
             uses: actions/setup-node@v4
             with:
              node-version: "18"

           - name: cache of modules
             uses: actions/cache@v4
             id: cache-data
             with:
              path: node_modules
              key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
               ${{ runner.os }}-node-
          
           - name: install dependencies
             if: steps.cache-data.outputs.cache-hit != 'true'
             run: npm install
             
           - name: npm test
             continue-on-error: true
             id: test-report
             run: npm test
          
           - name: workflow condetion
             if: failure() && steps.test-report.outcome == 'failure'
             uses: actions/upload-artifact@v4
             with:
              name: dist-files
              path: ./public


    build:
      needs: test
      runs-on: ubuntu-latest
      steps:
          - name: checkout code
            uses: actions/checkout@v4

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
              node-version: "18"
          
          - name: cache of modules
            uses: actions/cache@v4
            id: cache-data
            with:
              path: node_modules
              key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
               ${{ runner.os }}-node-

          - name: install dependencies
            if: steps.cache-data.outputs.cache-hit != 'true'
            run: npm install

          - name: Build Project
            run: npm run build
          
          - name: upload artifact
            uses: actions/upload-artifact@v4
            with:
              name: dist-files
              path: ./public
          
    deploy:
      needs: build
      uses: ./.github/workflows/re-usable.yml
      with:
        environment: "production"
      
