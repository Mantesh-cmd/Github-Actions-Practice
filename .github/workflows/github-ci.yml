name: My First Workflow

# Event 
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - closed
    branches:
      - 'main'
      - 'dev-**'
      - 'releases/**'
  push:
    branches:
      - 'main'
      - 'dev-**'
      - 'releases/**'

  workflow_dispatch:

# Workflow
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
           - uses: actions/checkout@v4

           - name: Run a one-line script
             run:  echo Hello, world!

           - name: Run multiple commands
             run: |
               echo "this is first command"
               echo "this is second command"