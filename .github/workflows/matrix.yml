name: Matrix Workflow

on: push

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                os: [ubuntu-latest,windows-latest,macos-latest]
                version: [12, 14, 15]

        steps:
            - name: checkout code
              uses: actions/checkout@v5
            
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "18" 

            - name: install dependencies
              run: npm install 
            
            
            - name: npm test
              id: test-report
              run: npm test
          
            - name: workflow condetion
              if: failure() && steps.test-report.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
               name: dist-files
               path: ./public