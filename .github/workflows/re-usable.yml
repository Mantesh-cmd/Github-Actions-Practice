name: The re-usable workflow

on:
    push:
        branches: 
            - main
    workflow_call:
        inputs:
            artifact-name:
                description: The deployment artifacts name
                required: false
                type: string

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: check code
              uses: actions/download-artifact@v5
              with:
                name: ${{ inputs.artifact-name }}

            - name: list files
              run: ls

            - name: Testing the workflow
              run: |
                echo "Re-usable workflow is working"

